function go(t){$('nav').innerHTML=T.map(x=>`<button class="${x[0]==t?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');F[t]()}

/* Lộ trình */
const RD=[['Chào hỏi & giới thiệu','Hỏi tên, quốc tịch, 吗 / 呢 / 吧','talk'],['Số đếm & tiền','一 → 万, 两 + lượng từ, đọc giá tiền','form'],['Thời gian','Ngày tháng, thứ, buổi trong ngày','vocab'],['Địa điểm & phương hướng','在, 往, 离, 从…到…','form'],['Ăn uống & mua sắm','要, 喜欢, 还是 / 或者','quiz'],['Phương tiện đi lại','坐 / 骑 / 开 + phương tiện','match'],['Cấu trúc nâng cao','是…的, 又…又…, 让 / 请, 给','trans'],['Tập viết chữ cơ bản','Luyện nét và thứ tự nét','write'],['Thử thách cuối','Tổng ôn 12 tình huống','story']];
F.road=()=>{S.rd=S.rd||[];const n=S.rd.length;out(`<h2>Lộ trình 9 bước</h2><div class="mu">Hoàn thành ${n}/9 · Tiến độ được lưu trên trình duyệt này</div><div style="height:10px;background:var(--bd);border-radius:9px;overflow:hidden"><div style="height:100%;width:${n/9*100}%;background:var(--ok)"></div></div>`+RD.map((r,i)=>`<div class="card"><label><input type="checkbox" ${S.rd.includes(i)?'checked':''} onchange="tg(${i})"> <b>Bước ${i+1}: ${r[0]}</b></label><div class="mu">${r[1]}</div><button onclick="go('${r[2]}')">Học ngay</button></div>`).join(''))};
function tg(i){S.rd=S.rd||[];const k=S.rd.indexOf(i);k<0?S.rd.push(i):S.rd.splice(k,1);sv();F.road()}

/* Từ vựng */
F.vocab=()=>out(`<h2>Từ vựng theo nhóm (${pool().length} từ)</h2>${selG('F.vocab')}<div class="mu">Chạm vào thẻ để xem nghĩa, 🔊 để nghe phát âm.</div><br><div class="grid">${pool().map(w=>`<div class="card w" onclick="this.classList.toggle('on')"><div class="em">${EM[w.h]||'🈶'}</div><div class="h">${w.h}</div><div class="p">${w.p}</div><div class="m">${w.m}</div><span class="sp" onclick="event.stopPropagation();say('${w.h}')">🔊</span></div>`).join('')}</div>`);

/* Bài tập từ vựng */
let Q={};
F.quiz=()=>{if(!Q.l){out(`<h2>Bài tập từ vựng</h2>${selG('F.quiz')}<div class="row"><button onclick="qs(0)">Chữ → Nghĩa</button><button onclick="qs(1)">Nghĩa → Chữ</button></div><div class="mu">10 câu mỗi lượt, chọn nhóm từ ở trên.</div>`+(Q.done!=null?`<div class="card">Lần trước: <b>${Q.done}/10</b></div>`:''));return}
const w=Q.w,L=x=>Q.m?x.h+' '+x.p:x.m;out(`<h2>Câu ${Q.i+1}/10 · Điểm ${Q.s}</h2><div class="card">${Q.m?w.m:`<span class="bg">${EM[w.h]||''} ${w.h}</span> ${w.p}`}</div>${Q.o.map((x,i)=>`<button class="opt" onclick="qa(this,${i})">${L(x)}</button>`).join('')}`)};
function qs(m){const p=sh(pool());if(p.length<4)return;Q={m,l:p.slice(0,10),i:0,s:0};qn()}
function qn(){const w=Q.l[Q.i];Q.w=w;Q.o=sh([w,...sh(W.filter(x=>x!=w&&x.m!=w.m)).slice(0,3)]);F.quiz()}
function qa(b,i){if(Q.k)return;Q.k=1;const r=Q.o[i]==Q.w;r?(Q.s++,b.classList.add('ok')):(b.classList.add('no'),[...document.querySelectorAll('.opt')].forEach((e,j)=>Q.o[j]==Q.w&&e.classList.add('ok')));setTimeout(()=>{Q.k=0;if(++Q.i<Q.l.length)qn();else{Q={done:Q.s};F.quiz()}},900)}

/* Nối từ */
let M={};
function mn(){const a=sh(pool()).slice(0,6),ix=a.map((_,i)=>i);M={a,L:sh(ix),R:sh(ix),s:null,d:[],mv:0};F.match()}
F.match=()=>{if(!M.a)return mn();const b=(k,i)=>`<button class="opt ${M.d.includes(i)?'ok':M.s&&M.s[0]==k&&M.s[1]==i?'on':''}" ${M.d.includes(i)?'disabled':''} onclick="mp('${k}',${i})">${k=='L'?(EM[M.a[i].h]||'')+' '+M.a[i].h+' <small>'+M.a[i].p+'</small>':M.a[i].m}</button>`;
out(`<h2>Nối từ</h2>${selG('mn')}<div class="mu">Nối chữ Hán với nghĩa đúng. Số lượt: ${M.mv}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div>${M.L.map(i=>b('L',i)).join('')}</div><div>${M.R.map(i=>b('R',i)).join('')}</div></div>${M.d.length==M.a.length?`<div class="card"><b>Hoàn thành sau ${M.mv} lượt!</b></div>`:''}<button onclick="mn()">Chơi lại</button>`)};
function mp(k,i){if(!M.s||M.s[0]==k)M.s=[k,i];else{M.mv++;if(M.s[1]==i)M.d.push(i);M.s=null}F.match()}

/* Dịch câu */
const SN=[['我的|手机|在|这里|。','Điện thoại của tôi ở đây.'],['今天|我|不|工作|。','Hôm nay tôi không làm việc.'],['我|要|喝|一点儿|奶茶|。','Tôi muốn uống một chút trà sữa.'],['从|我家|到|公司|很|近|。','Từ nhà tôi đến công ty rất gần.'],['我们|是|在|公司|认识|的|。','Chúng tôi quen nhau ở công ty.'],['明天|晚上|八点|我们|在|电影院|见面|吧|。','Tối mai 8 giờ chúng ta gặp nhau ở rạp chiếu phim nhé.'],['我|是|坐|飞机|来|的|。','Tôi đến bằng máy bay.'],['你|喜欢|喝|奶茶|还是|咖啡|？','Bạn thích uống trà sữa hay cà phê?'],['我家|离|电影院|很|远|。','Nhà tôi cách rạp chiếu phim rất xa.'],['她|又|漂亮|又|聪明|。','Cô ấy vừa đẹp vừa thông minh.'],['我|给|她|打|电话|。','Tôi gọi điện thoại cho cô ấy.'],['你|是|哪|国|人|？','Bạn là người nước nào?'],['我|要|两|杯|奶茶|。','Tôi muốn hai ly trà sữa.'],['饭店|前边|是|一家|商店|。','Phía trước nhà hàng là một cửa hàng.']];
let X={i:0};
function xn(){X.t=SN[X.i][0].split('|');X.b=sh(X.t.map((_,k)=>k));X.a=[];F.trans()}
F.trans=()=>{if(!X.t)return xn();const t=X.t;out(`<h2>Dịch câu: sắp xếp từ</h2><div class="mu">Câu ${X.i+1}/${SN.length}. Dịch sang tiếng Trung bằng cách chạm từng từ theo thứ tự.</div><div class="card"><b>${SN[X.i][1]}</b></div><div class="card" style="min-height:52px">${X.a.map(k=>`<button onclick="xr(${k})">${t[k]}</button>`).join(' ')}</div><div class="row">${X.b.filter(k=>!X.a.includes(k)).map(k=>`<button onclick="xa(${k})">${t[k]}</button>`).join('')}</div><div class="row"><button onclick="xc()">Kiểm tra</button><button onclick="X.i=(X.i+1)%SN.length;xn()">Câu khác ➜</button></div><div id="xf"></div>`)};
function xa(k){X.a.push(k);F.trans()}function xr(k){X.a=X.a.filter(x=>x!=k);F.trans()}
function xc(){const s=X.t.join(''),ok=X.a.map(k=>X.t[k]).join('')==s;$('#xf').innerHTML=ok?`<div class="card">Đúng! ${s} <span class="sp" onclick="say('${s}')">🔊</span></div>`:`<div class="card">Chưa đúng. Đáp án: ${s}</div>`}

/* Hội thoại */
const D=[['Làm quen',[['A','你好！你叫什么名字？','Nǐ hǎo! Nǐ jiào shénme míngzi?','Xin chào! Bạn tên gì?'],['B','我叫阿明。你是哪国人？','Wǒ jiào Āmíng. Nǐ shì nǎ guó rén?','Tôi tên A Minh. Bạn là người nước nào?'],['A','我是越南人。你呢？','Wǒ shì Yuènán rén. Nǐ ne?','Tôi là người Việt Nam. Còn bạn?']]],
['Hẹn xem phim',[['A','明天你有时间吗？','Míngtiān nǐ yǒu shíjiān ma?','Ngày mai bạn rảnh không?'],['B','有。怎么了？','Yǒu. Zěnme le?','Có. Sao vậy?'],['A','我们去看电影吧。','Wǒmen qù kàn diànyǐng ba.','Chúng ta đi xem phim nhé.'],['B','好啊，晚上八点电影院见。','Hǎo a, wǎnshang bā diǎn diànyǐngyuàn jiàn.','Được, 8 giờ tối gặp ở rạp.']]],
['Quán trà sữa',[['A','你要喝什么？','Nǐ yào hē shénme?','Bạn muốn uống gì?'],['B','我要两杯奶茶。','Wǒ yào liǎng bēi nǎichá.','Tôi muốn hai ly trà sữa.'],['A','一共三万五千越南盾。','Yígòng sānwàn wǔqiān Yuènán dùn.','Tổng cộng 35.000 đồng.']]],
['Hỏi đường',[['A','请问，银行在哪儿？','Qǐngwèn, yínháng zài nǎr?','Xin hỏi, ngân hàng ở đâu?'],['B','就在饭店的对面。','Jiù zài fàndiàn de duìmiàn.','Ngay đối diện nhà hàng.'],['A','怎么走？','Zěnme zǒu?','Đi thế nào?'],['B','往前走，然后往右拐。','Wǎng qián zǒu, ránhòu wǎng yòu guǎi.','Đi thẳng, rồi quẹo phải.']]]];

F.talk=()=>out(`<h2>Hội thoại</h2><label><input type="checkbox" ${tp?'checked':''} onchange="tp=this.checked;F.talk()"> Pinyin</label> &nbsp; <label><input type="checkbox" ${tv?'checked':''} onchange="tv=this.checked;F.talk()"> Nghĩa</label>`+D.map(d=>`<div class="card"><b>${d[0]}</b>`+d[1].map(l=>`<p><b>${l[0]}:</b> <span style="font-size:20px">${l[1]}</span> <span class="sp" onclick="say('${l[1]}')">🔊</span>${tp?`<br><span class="p">${l[2]}</span>`:''}${tv?`<br><span class="mu">${l[3]}</span>`:''}</p>`).join('')+'</div>').join(''));

/* Viết chữ */
const WC=[['一','yī','một'],['二','èr','hai'],['三','sān','ba'],['十','shí','mười'],['人','rén','người'],['大','dà','to'],['小','xiǎo','nhỏ'],['中','zhōng','giữa'],['国','guó','nước'],['你','nǐ','bạn'],['我','wǒ','tôi'],['他','tā','anh ấy'],['好','hǎo','tốt'],['月','yuè','tháng'],['水','shuǐ','nước'],['家','jiā','nhà']];
let wi=0,gh=1;
F.write=()=>{out(`<h2>Luyện viết chữ</h2><div class="row">${WC.map((c,i)=>`<button class="${i==wi?'on':''}" onclick="wi=${i};F.write()">${c[0]}</button>`).join('')}</div><div class="card"><b>${WC[wi][0]}</b> · ${WC[wi][1]} · ${WC[wi][2]} <span class="sp" onclick="say('${WC[wi][0]}')">🔊</span><br><canvas id="cv" width="280" height="280" style="width:280px;max-width:100%;touch-action:none;border:1px solid var(--bd);border-radius:10px"></canvas><div class="row"><button onclick="gh=!gh;F.write()">${gh?'Ẩn':'Hiện'} chữ mẫu</button><button onclick="F.write()">Xoá</button></div></div><div class="card mu">Quy tắc nét: trên → dưới, trái → phải; ngang trước sổ; phẩy trước mác; ngoài trước trong; giữa trước hai bên; vào nhà trước, đóng cửa sau.</div>`);
const c=$('#cv'),x=c.getContext('2d');x.strokeStyle='rgba(150,150,150,.5)';x.setLineDash([4,4]);x.strokeRect(0,0,280,280);x.beginPath();x.moveTo(140,0);x.lineTo(140,280);x.moveTo(0,140);x.lineTo(280,140);x.stroke();x.setLineDash([]);
if(gh){x.font='220px KaiTi,"Kaiti SC",serif';x.fillStyle='rgba(150,150,150,.35)';x.textAlign='center';x.textBaseline='middle';x.fillText(WC[wi][0],140,150)}
x.lineWidth=7;x.lineCap=x.lineJoin='round';x.strokeStyle=getComputedStyle(document.body).color;let d=0;
const P=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*280/r.width,(e.clientY-r.top)*280/r.height]};
c.onpointerdown=e=>{d=1;c.setPointerCapture(e.pointerId);const[a,b]=P(e);x.beginPath();x.moveTo(a,b);x.lineTo(a+.1,b);x.stroke()};
c.onpointermove=e=>{if(d){const[a,b]=P(e);x.lineTo(a,b);x.stroke()}};c.onpointerup=c.onpointercancel=()=>d=0};

F.form=()=>out(`<h2>Công thức ngữ pháp</h2>`+FM.map(f=>`<div class="card"><b>${f[0]}</b><div class="p">${f[1]}</div><div style="font-size:19px">${f[2]} <span class="sp" onclick="say('${f[2]}')">🔊</span></div><div class="mu">${f[3]}<br>${f[4]}</div></div>`).join(''));
